[package]
name = "aikitr-desktop"
version = "0.1.0"
description = "Aikitr Desktop — enterprise Tauri 2 application."
authors = ["Aikitr <dev@aikitr.example.com>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aikitr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2.0"
tauri-plugin-store = "2.1"
tauri-plugin-fs = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
tauri-plugin-updater = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-http = { version = "2.0", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
