name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev libgtk-3-dev \
            gobject-introspection libgirepository1.0-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build desktop (Tauri)
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        # If a non-critical bundle format fails (e.g. DMG on macOS),
        # don't block the entire release — the core artifact (.app/.msi/.deb)
        # has already been produced successfully.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (generate via `tauri signer generate`).
          # Set this as a GitHub Secret; never commit the private key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Aikitr Desktop ${{ github.ref_name }}"
          releaseBody: "See assets below to download for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Windows portable (zip)
        if: matrix.platform == 'windows-latest'
        id: portable
        shell: pwsh
        run: |
          $BinaryName = "aikitr-desktop"
          $DisplayName = "Aikitr Desktop"
          $Version = "${{ github.ref_name }}".TrimStart("v")
          $TargetDir = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release"
          $ExePath = Join-Path $TargetDir "$BinaryName.exe"
          if (-not (Test-Path $ExePath)) {
            $TargetDir = "apps/desktop/src-tauri/target/release"
            $ExePath = Join-Path $TargetDir "$BinaryName.exe"
          }
          if (-not (Test-Path $ExePath)) {
            Write-Error "Cannot find portable exe at $ExePath"
            exit 1
          }
          $Stage = "portable-stage"
          $AppDir = Join-Path $Stage $DisplayName
          New-Item -ItemType Directory -Force -Path $AppDir | Out-Null
          Copy-Item $ExePath -Destination (Join-Path $AppDir "$DisplayName.exe")
          # Copy any sidecar DLLs / PDBs that sit next to the exe
          Get-ChildItem $TargetDir -File | Where-Object {
            $_.Extension -in ".dll", ".pdb"
          } | ForEach-Object { Copy-Item $_.FullName -Destination $AppDir }
          $ZipName = "Aikitr-Desktop_${Version}_x64-portable.zip"
          Compress-Archive -Path (Join-Path $Stage "*") -DestinationPath $ZipName -Force
          Write-Output "zipPath=$ZipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "zipName=$ZipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Created $ZipName"

      - name: Upload Windows portable asset
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.portable.outputs.zipPath }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    name: Release Please
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          package-name: aikitr
